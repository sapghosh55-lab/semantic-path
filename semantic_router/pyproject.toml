[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-router-api"
version = "0.1.0"
description = "High-performance cost-optimizing LLM proxy gateway with fast sentence similarity routing"
authors = [
    { name = "Hacktoberfest Systems Engineer", email = "engineer@example.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sentence-transformers>=2.5.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["semantic_router/tests"]
pythonpath = ["semantic_router", "."]
