routes:
  - name: "fast_lane"
    description: "Simple tasks: factual lookup, greetings, simple sentiment, typo corrections, basic formatting, math, temperature and unit conversions"
    target_model: "gemma2:2b"
    cost_per_1k_tokens: 0.0001
    utterances:
      - "What is the capital of France?"
      - "Hello! How are you doing today?"
      - "What is 25 multiplied by 4?"
      - "Convert 25 degrees celsius to fahrenheit"
      - "what is 25 degree in fahrenheit"
      - "convert 100 celsius to fahrenheit"
      - "how many kilometers in 5 miles"
      - "calculate 15 percent of 80"
      - "what is the capital of Japan?"
      - "Fix typos and grammar: 'He go to store yesterday.'"
      - "Is this sentence positive or negative: 'I love sunny mornings!'"
      - "Format this raw text into a clean JSON bullet list."
      - "Convert hello world to uppercase."
      - "Give me a synonym for quick."
      - "What time zone is London in?"
      - "Translate thank you to French."

  - name: "deep_lane"
    description: "Complex tasks: multi-step reasoning, architectural design, algorithmic code generation, complex refactoring"
    target_model: "llama-3.3-70b-versatile"
    cost_per_1k_tokens: 0.015
    utterances:
      - "Write a complete thread-safe memory pool allocator in C++"
      - "Implement a distributed consensus algorithm with Raft or Paxos"
      - "Audit an Ethereum smart contract for reentrancy vulnerabilities"
      - "Derive the mathematical proof for time complexity"
      - "Design a distributed consensus algorithm with Byzantine fault tolerance in C++"
      - "Write a high-performance FastAPI async LLM router with sentence transformer vector search."
      - "Design a fault-tolerant microservices architecture with Kafka, Redis, and PostgreSQL for 100k QPS."
      - "Refactor this legacy monolithic C++ memory allocation codebase into memory-safe Rust code."
      - "Solve the Traveling Salesperson Problem using dynamic programming with bitmasking in Python."
      - "Provide a multi-step threat model and risk analysis for a cloud-native Kubernetes deployment."
      - "Explain Quantum Field Theory and derive the Dirac equation step by step."
      - "Architect a distributed consensus protocol similar to Raft with leader election and log replication."
